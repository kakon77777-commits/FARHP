[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opensound-reference"
version = "0.1.0"
description = "Reference canonical contract layer for FARHP Open Sound"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["jsonschema>=4.18"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
