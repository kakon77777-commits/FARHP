<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EMPSL Grammar Lab v0.4</title><style>
:root{--ink:#121722;--muted:#706657;--gold:#9a6124;--paper:#fbf5e8;--card:#fffdf8;--line:#d8cbb8;--red:#a42828;--green:#16653b;--amber:#a56a05;--blue:#28598a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 8%,#fffdf4,#efe3cc 56%,#dac5a2);color:var(--ink);font-family:Inter,"Noto Sans TC",system-ui,sans-serif}.hero{padding:54px max(24px,5vw) 32px}.kicker{letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:900}.hero h1{font-family:Georgia,"Noto Serif TC",serif;font-size:clamp(40px,6vw,76px);line-height:.96;margin:.18em 0}.hero p{max-width:1050px;color:var(--muted);font-size:18px;line-height:1.7}.layout{display:grid;grid-template-columns:minmax(380px,540px) minmax(400px,1fr);gap:24px;padding:0 max(24px,5vw) 50px}.panel{background:rgba(255,253,248,.9);border:1px solid var(--line);border-radius:28px;box-shadow:0 24px 72px #5b3e1622;padding:24px}.sticky{position:sticky;top:16px;align-self:start}.glyph-stage{background:var(--paper);border:1px solid var(--line);border-radius:24px;min-height:410px;display:grid;place-items:center}.glyph-stage svg{width:min(100%,450px)}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.field{display:flex;flex-direction:column;gap:5px}.field.wide{grid-column:1/-1}.field.triple{grid-column:span 1}label{font-size:11px;font-weight:900;color:var(--muted);letter-spacing:.06em}select,input{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:11px;background:white;color:var(--ink)}.check{display:flex;align-items:center;gap:8px}.check input{width:auto}.actions{display:flex;flex-wrap:wrap;gap:9px;margin:16px 0}button{border:0;border-radius:999px;padding:11px 15px;background:var(--ink);color:#fff;font-weight:850;cursor:pointer}button.alt{background:var(--gold)}button.soft{background:#ece2cf;color:var(--ink)}pre{white-space:pre-wrap;word-break:break-word;background:#161a20;color:#efe6d8;padding:16px;border-radius:16px;max-height:420px;overflow:auto;font-size:11px}.ok{color:var(--green);font-weight:900}.bad{color:var(--red);font-weight:900}.note{border-left:4px solid var(--gold);padding:12px 16px;background:#f7ead4;border-radius:0 12px 12px 0;color:#5b4d39;line-height:1.65}.section-title{font-family:Georgia,"Noto Serif TC",serif;font-size:30px;margin:30px 0 12px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:16px 0 24px}.stat{background:#f8ecd7;border:1px solid #decdb0;border-radius:16px;padding:14px}.stat b{display:block;font-size:28px;font-family:Georgia,serif}.stat span{color:var(--muted);font-size:12px}.issues{display:grid;gap:8px}.issue{border:1px solid var(--line);border-left-width:5px;border-radius:14px;padding:11px 13px;background:#fff}.issue.error{border-left-color:var(--red)}.issue.warning{border-left-color:var(--amber)}.issue b{display:block;font-size:13px}.issue span,.issue small{display:block;color:var(--muted);margin-top:4px}.empty{padding:14px;border:1px dashed var(--line);border-radius:12px;color:var(--green)}.rule-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:11px}.rule{border:1px solid var(--line);background:#fff;border-radius:16px;padding:14px}.rule header{display:flex;justify-content:space-between;gap:8px;color:var(--gold);font-size:11px}.rule h3{font-size:15px;margin:9px 0 5px}.rule p{font-size:12px;color:var(--muted);line-height:1.5}.rule em{font-size:10px;color:var(--blue);font-style:normal}.atom-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.atom-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;text-align:center;cursor:pointer}.atom-card:hover{outline:3px solid #9a612433}.atom-svg{height:88px;display:grid;place-items:center}.atom-svg svg{width:84px;height:84px}.atom-card b,.atom-card span{display:block;font-size:9px}.atom-card span{color:var(--muted)}#variantMeta{font-weight:850;color:var(--gold);margin:10px 0}.subhead{grid-column:1/-1;border-top:1px solid var(--line);padding-top:12px;margin-top:4px;font-weight:900;color:var(--gold)}.inline-meta{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}@media(max-width:1050px){.layout{grid-template-columns:1fr}.sticky{position:static}}@media(max-width:620px){.controls{grid-template-columns:1fr}.atom-grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header class="hero"><div class="kicker">EveMissLab · EMPSL v0.4</div><h1>Glyph Grammar Lab<br>字形語法與合法性層</h1><p>字形不再只是「能組合就算合法」。v0.4 同時檢查華語音系、受控變換、型別化語義、算子參數數量與 FARHP 聲學相容性，並為每個配方產生可稽核的規則證書。</p></header><main class="layout"><section class="panel sticky"><div id="glyph" class="glyph-stage"></div><div id="variantMeta"></div><div class="inline-meta"><span>推導聲學類別：<b id="inferredClass"></b></span><span>規則集：<b>v0.4</b></span></div><div class="controls">
<div class="field wide"><label>穩定字形 ID</label><input id="gid"></div><div class="field"><label>語義外框</label><select id="frame"></select></div><div class="field"><label>基礎種子</label><select id="seedBase"></select></div><div class="field"><label>受控變換</label><select id="seedTransform"></select></div><div class="field"><label>變換角色</label><select id="transformRole"></select></div>
<div class="subhead">華語音系與相位</div><div class="field"><label>聲母</label><select id="onset"></select></div><div class="field"><label>四呼</label><select id="hu"></select></div><div class="field"><label>韻類</label><select id="rime"></select></div><div class="field"><label>結構附標</label><select id="structure"></select></div><div class="field"><label>詞典聲調</label><select id="tone"></select></div><div class="field"><label>可視 FARHP 相位</label><select id="phase"></select></div>
<div class="subhead">型別化語義</div><div class="field"><label>語義／算子附標</label><select id="operator"></select></div><div class="field"><label>語義種類</label><select id="semanticKind"></select></div><div class="field wide"><label>概念 ID</label><input id="concept"></div><div class="field"><label>參數模式</label><select id="arityMode"><option value="fixed">fixed</option><option value="variadic">variadic</option></select></div><div class="field"><label>固定數量／最小數量</label><input id="arityValue" type="number" min="0" max="8"></div><div class="field wide"><label>輸入型別（逗號分隔）</label><input id="inputTypes"></div><div class="field"><label>輸出型別</label><select id="outputType"></select></div><div class="field"><label>讀法</label><input id="reading"></div><div class="field wide"><label>義項</label><input id="gloss"></div>
<div class="subhead">FARHP 聲學物件</div><div class="field"><label>來源</label><select id="acousticSource"></select></div><div class="field"><label>宣告聲學類別</label><select id="acousticClass"></select></div><div class="field"><label>聲學相位簽名</label><select id="phaseSignature"></select></div><div class="field"><label>信心度 <span id="confidenceValue"></span></label><input id="confidence" type="range" min="0" max="1" step="0.01"></div><div class="field wide"><label>FARHP profile ID</label><input id="profileId"></div><div class="field wide check"><input id="rawMode" type="checkbox"><label for="rawMode">顯示純幾何變體</label></div></div>
<div class="actions"><button id="legalExample" class="alt">載入合法案例</button><button id="invalidExample" class="soft">載入錯誤案例</button><button id="repair">自動修正</button><button id="exportSvg">匯出 SVG</button><button id="exportJson">匯出 JSON</button></div><p id="status"></p><div id="issues" class="issues"></div><h3>完整配方</h3><pre id="json"></pre></section><section class="panel"><p class="note">JSON Schema 負責結構正確；v0.4 規則引擎負責跨欄位語法。通過 Schema 並不代表音系、算子參數或 FARHP 相位一定合法。</p><h2 class="section-title">批次驗證證書</h2><div id="stats" class="stats"></div><h2 class="section-title">目前種子的八個變體</h2><div id="variantGallery" class="atom-grid"></div><h2 class="section-title">30 條合法性規則</h2><div id="ruleGrid" class="rule-grid"></div></section></main>
<script src="data/EMPSL_atom_registry_v0.2.js"></script><script src="data/EMPSL_seed_variant_registry_v0.3.js"></script><script src="rules/EMPSL_grammar_tables_v0.4.js"></script><script src="rules/EMPSL_rule_catalog_v0.4.js"></script><script src="data/EMPSL_legality_report_v0.4.js"></script><script src="examples/EMPSL_legality_examples_v0.4.js"></script><script src="assets/empsl_core.js"></script><script src="assets/app.js"></script></body></html>
