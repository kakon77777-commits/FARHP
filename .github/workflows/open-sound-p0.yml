name: Open Sound P0 Contracts

on:
  push:
    branches:
      - integration/open-sound-mvp-v0.1
  pull_request:
    branches:
      - main

jobs:
  p0-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install FARHP Core
        run: python -m pip install -e farhp/core
      - name: Run FARHP Core regression
        run: python -m unittest discover -s farhp/core/tests -v
      - name: Run Open Sound P0 contracts
        env:
          PYTHONPATH: opensound/src
        run: python -m unittest discover -s opensound/tests -v
