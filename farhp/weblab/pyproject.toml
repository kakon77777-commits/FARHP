[project]
name = "farhp-research-server"
version = "1.0.0rc1"
description = "FARHP productionization release candidate"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.128,<0.129",
  "uvicorn[standard]>=0.48,<0.49",
  "SQLAlchemy>=2.0,<2.1",
  "alembic>=1.18,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.13,<3",
  "argon2-cffi>=25,<26",
  "itsdangerous>=2.2,<3",
  "PyJWT[crypto]>=2.13,<3",
  "jsonschema>=4.26,<5",
  "python-multipart>=0.0.29,<0.1",
  "httpx>=0.28,<0.29",
]

[project.optional-dependencies]
test = ["pytest>=9,<10", "playwright>=1.58,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
