<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FARHP 匿名研究入口</title><link rel="stylesheet" href="/assets/server.css"></head><body class="participant"><header><div class="brand"><span>Φ</span><div><b>FARHP 匿名研究入口</b><small>v1.0 RC participant portal</small></div></div></header><main class="narrow"><section class="card"><p class="eyebrow">ANONYMOUS PARTICIPATION</p><h1 id="studyTitle">讀取研究計畫…</h1><div id="planInfo" class="planinfo"></div><div id="consentBox" hidden><h2 id="consentTitle">參與同意</h2><p id="consentText"></p><label class="check"><input id="eligibility" type="checkbox">我確認符合研究者所述的參與資格。</label><label class="check"><input id="consent" type="checkbox">我已閱讀上述說明，並自願參與。</label><label>自訂撤回代碼<input id="withdrawal" minlength="6" maxlength="80" placeholder="至少 6 個字元；請自行保存"></label><button id="startBtn">建立匿名工作階段</button></div><div id="participantState" class="state">正在讀取邀請…</div></section><section id="ready" class="card" hidden><h2>工作階段已建立</h2><div class="metrics"><div><small>匿名代碼</small><b id="participantCode"></b></div><div><small>狀態</small><b>已同意</b></div></div><button id="openLabBtn">開啟 FARHP WebLab</button><p class="hint">WebLab 會使用同一來源的 sessionStorage 保存短期工作階段權杖；完成資料將自動同步到伺服器。</p></section></main><script src="/assets/participant.js"></script></body></html>
